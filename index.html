<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>SECTOR S — Beta 1.0</title>
<style>
:root{--bg:#07090d;--panel:#11151c;--panel2:#171c26;--line:#2b3344;--red:#e0303c;--red2:#ff6b75;--amber:#ffb020;--ink:#f1f3f7;--mute:#8791a6;--pink:#ff8fd0;--ok:#4fd18b}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:'Courier New',Courier,monospace}
html,body{margin:0;padding:0;width:100%;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;position:fixed;touch-action:none}
canvas#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;touch-action:none}
img{image-rendering:pixelated}
.hide{display:none!important}
button{background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:0;padding:12px 14px;font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 #04060a;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #04060a}
button:disabled{opacity:.38;cursor:not-allowed}
.red{background:var(--red);border-color:var(--red2);color:#fff}
.amb{background:var(--amber);border-color:#ffe08a;color:#1b1204}

/* ---------- pantallas ---------- */
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,rgba(30,8,12,.78),rgba(4,5,8,.95));z-index:30;overflow:auto}
.panel{width:min(460px,100%);background:var(--panel);border:2px solid var(--line);padding:22px 18px;box-shadow:0 0 0 2px #000,0 10px 0 #04060a;position:relative}
.panel::before{content:"";position:absolute;left:-2px;top:-2px;width:46px;height:6px;background:var(--red)}
.title{margin:0;font-size:clamp(44px,13vw,74px);line-height:.9;font-weight:900;letter-spacing:.02em;font-style:italic;transform:skewX(-8deg);text-shadow:4px 4px 0 #000}
.title b{color:var(--red);font-size:1.35em;display:inline-block;margin-left:.05em}
.tag{margin:12px 0 4px;font-size:11px;letter-spacing:.2em;color:var(--amber);font-weight:900}
.ver{font-size:10px;color:var(--mute);letter-spacing:.2em;margin-bottom:18px}
.stack{display:grid;gap:10px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.muted{color:var(--mute);font-size:11px;line-height:1.6}
h2{margin:0 0 12px;font-size:20px;letter-spacing:.1em}
.choice{flex-direction:column;padding:10px 6px;background:#0d1016}
.choice.sel{border-color:var(--amber);background:#241d10}
.choice img{width:96px;height:96px;object-fit:contain}
.shop-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:900}
.shop-head .sc{color:var(--amber)}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;background:#0d1016;border:2px solid var(--line);margin-top:8px}
.item .n{font-weight:900;font-size:13px}
.item .d{font-size:10px;color:var(--mute);margin-top:2px}
.item button{padding:8px 10px;font-size:11px;min-width:74px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .tl{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px}
#hud .tr{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;text-align:right}
.hpwrap{display:flex;align-items:center;gap:8px}
#heart{width:30px;height:27px;image-rendering:pixelated}
.bar{width:min(170px,38vw);height:16px;background:#14081a;border:3px solid #000;outline:2px solid #fff;position:relative}
#hpfill{height:100%;width:100%;background:linear-gradient(#ffc6ea,#ff8fd0 55%,#d85cff);transition:width .12s}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(0,0,0,.35) 11px 13px)}
.wtxt{margin-top:6px;font-size:11px;font-weight:900;letter-spacing:.1em;text-shadow:2px 2px 0 #000}
.wtxt b{color:var(--amber)}
.stars{font-size:26px;letter-spacing:2px;line-height:1;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000}
.stars .on{color:#fff}.stars .off{color:#3b4150}
.ammo{margin-top:6px;display:flex;align-items:center;justify-content:flex-end;gap:8px;text-shadow:2px 2px 0 #000}
.ammo .a{font-size:26px;font-weight:900;color:#fff}.ammo .r{font-size:18px;font-weight:900;color:#aab3c6}
#wico{width:62px;height:30px;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 #000)}
.mini{margin-top:4px;font-size:11px;font-weight:900;text-shadow:2px 2px 0 #000}
.mini b{color:var(--amber)}
#topbtns{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
#topbtns button{padding:4px 10px;font-size:12px;box-shadow:0 2px 0 #04060a;background:rgba(17,21,28,.85)}
#banner{position:absolute;left:0;right:0;top:26%;text-align:center;opacity:0;pointer-events:none}
#banner .b1{font-size:clamp(28px,8vw,52px);font-weight:900;font-style:italic;letter-spacing:.06em;text-shadow:4px 4px 0 #000;color:#fff}
#banner .b2{font-size:12px;letter-spacing:.2em;color:var(--amber);font-weight:900;margin-top:4px;text-shadow:2px 2px 0 #000}
#banner.show{animation:bn 2.4s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:scale(1.25)}10%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;top:max(54px,calc(env(safe-area-inset-top) + 46px));transform:translateX(-50%);background:rgba(17,21,28,.92);border:2px solid var(--amber);padding:5px 12px;font-size:11px;font-weight:900;white-space:nowrap;opacity:0;transition:opacity .15s}
#prompt{position:absolute;left:50%;bottom:34%;transform:translateX(-50%);background:rgba(0,0,0,.7);border:2px solid var(--amber);padding:5px 12px;font-size:12px;font-weight:900;color:var(--amber);letter-spacing:.1em}
#prep{position:absolute;left:50%;top:max(84px,calc(env(safe-area-inset-top) + 76px));transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--amber);text-shadow:2px 2px 0 #000;white-space:nowrap}

/* ---------- controles tactiles ---------- */
.zone{position:fixed;bottom:0;height:62%;width:50%;z-index:12;touch-action:none}
#zoneL{left:0}#zoneR{right:0}
.stick{position:fixed;width:110px;height:110px;border:3px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);border-radius:50%;z-index:13;pointer-events:none;transition:opacity .15s;opacity:.55}
.stick.on{opacity:1;border-color:rgba(255,255,255,.55)}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.32);border:3px solid rgba(255,255,255,.7)}
#stickR .knob{background:rgba(224,48,60,.55);border-color:#ff8a92}
#btns{position:fixed;right:14px;bottom:170px;display:grid;grid-template-columns:repeat(2,58px);gap:10px;z-index:14}
.rb{width:58px;height:58px;padding:0;border-radius:0;background:rgba(17,21,28,.82);font-size:11px}
.rb img{width:34px;height:34px;object-fit:contain;pointer-events:none}
body:not(.touch) .zone,body:not(.touch) .stick{display:none}
body:not(.touch) #btns{bottom:14px;grid-template-columns:repeat(5,52px)}
body:not(.touch) .rb{width:52px;height:52px}
@media (max-width:520px){#topbtns{left:12px;top:max(84px,calc(env(safe-area-inset-top) + 76px));transform:none}#toast{top:max(128px,calc(env(safe-area-inset-top) + 120px))}#prep{top:max(160px,calc(env(safe-area-inset-top) + 152px))}}
#hint{position:fixed;left:12px;bottom:12px;font-size:10px;color:var(--mute);z-index:9;pointer-events:none;line-height:1.6}
body.touch #hint{display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hide">
  <div class="tl">
    <div class="hpwrap"><canvas id="heart" width="21" height="18"></canvas><div class="bar"><div id="hpfill"></div></div></div>
    <div class="wtxt">OLEADA <b id="wave">1</b> · ZOMBIS <b id="zleft">0</b></div>
  </div>
  <div id="topbtns"><button id="bPause">II</button><button id="bMute">SND</button></div>
  <div class="tr">
    <div class="stars" id="stars"></div>
    <div class="ammo"><canvas id="wico" width="62" height="30"></canvas><div><span class="a" id="amMag">12</span><span class="r" id="amRes">/36</span></div></div>
    <div class="mini">CHATARRA <b id="scrap">0</b> · BOTIQUÍN <b id="meds">1</b></div>
    <div class="mini">BAJAS <b id="kills">0</b></div>
  </div>
  <div id="banner"><div class="b1" id="b1"></div><div class="b2" id="b2"></div></div>
  <div id="prep" class="hide"></div>
  <div id="prompt" class="hide"></div>
  <div id="toast"></div>
  <div id="hint">WASD MOVER · MOUSE APUNTAR/DISPARAR · R RECARGAR · Q/1-4 ARMA · E USAR · H CURAR · B TALLER</div>
</div>

<div id="zoneL" class="zone hide"></div><div id="zoneR" class="zone hide"></div>
<div id="stickL" class="stick hide"><div class="knob" id="knobL"></div></div>
<div id="stickR" class="stick hide"><div class="knob" id="knobR"></div></div>
<div id="btns" class="hide">
  <button class="rb" id="bUse"><img src="assets/icon_pickup.png" alt="USAR"></button>
  <button class="rb" id="bShop"><img src="assets/icon_bag.png" alt="TALLER"></button>
  <button class="rb" id="bSwap"><img src="assets/icon_attack.png" alt="ARMA"></button>
  <button class="rb" id="bReload">R</button>
  <button class="rb" id="bHeal">+</button>
</div>

<section id="menu" class="screen">
  <div class="panel">
    <h1 class="title">SECTOR<b>S</b></h1>
    <div class="tag">NUESTRA SUPERVIVENCIA. NUESTRAS REGLAS.</div>
    <div class="ver">BETA 1.0 · MEJOR OLEADA: <span id="best">0</span></div>
    <div class="stack">
      <button class="red" id="new">NUEVA PARTIDA</button>
      <button id="continue">CONTINUAR</button>
      <button id="controls">CÓMO JUGAR</button>
    </div>
  </div>
</section>

<section id="select" class="screen hide">
  <div class="panel">
    <h2>ELIGE PROTAGONISTA</h2>
    <div class="row">
      <button class="choice sel" data-char="male"><img src="assets/male_front.png" alt="Hombre"><b>ÉL</b></button>
      <button class="choice" data-char="female"><img src="assets/female_front.png" alt="Mujer"><b>ELLA</b></button>
    </div>
    <div class="row" style="margin-top:16px"><button id="back">VOLVER</button><button class="red" id="enter">COMENZAR</button></div>
  </div>
</section>

<section id="shop" class="screen hide">
  <div class="panel">
    <div class="shop-head"><span>TALLER</span><span class="sc">CHATARRA: <b id="shopScrap">0</b></span></div>
    <div id="shopList"></div>
    <button id="shopClose" style="width:100%;margin-top:14px">VOLVER AL COMBATE</button>
  </div>
</section>

<section id="pauseScreen" class="screen hide">
  <div class="panel"><h2>PAUSA</h2>
    <div class="stack"><button class="red" id="resume">CONTINUAR</button><button id="save">GUARDAR PROGRESO</button><button id="quit">MENÚ PRINCIPAL</button></div>
  </div>
</section>

<section id="gameover" class="screen hide">
  <div class="panel"><h2 style="color:var(--red)">HAS CAÍDO</h2>
    <p class="muted" id="stats"></p>
    <div class="stack"><button class="red" id="retry">REINTENTAR</button><button id="quit2">MENÚ PRINCIPAL</button></div>
  </div>
</section>

<section id="info" class="screen hide">
  <div class="panel"><h2 id="ititle">INFO</h2><p id="itext" class="muted"></p><button id="closeInfo" style="width:100%">CERRAR</button></div>
</section>

<script>
'use strict';
/* =====================================================================
   SECTOR S — Beta 1.0
   Shooter de supervivencia por oleadas. Sprites en assets/*.png
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w, h, fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g,w,h);return c}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return Math.abs(d)}

/* ---------------- canvas / vista ---------------- */
const cv = $('game'), ctx = cv.getContext('2d');
const light = document.createElement('canvas'), lctx = light.getContext('2d');
let DPR = 1, SW = 0, SH = 0, ZOOM = 2, VW = 0, VH = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = innerWidth; SH = innerHeight;
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
  light.width = cv.width; light.height = cv.height;
  ZOOM = clamp(Math.min(SW / 380, SH / 280), 1.1, 3);
  VW = SW / ZOOM; VH = SH / ZOOM;
}
addEventListener('resize', resize); resize();
const TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (TOUCH) document.body.classList.add('touch');

/* ---------------- assets ---------------- */
const IMG = {};
['male_front','male_back','male_side','female_front','female_back','female_side','zombie','crate_closed','crate_open','bush','slash'].forEach(n=>{
  const i = new Image(); i.onload = () => { i.ok = true; }; i.src = 'assets/' + n + '.png'; IMG[n] = i;
});
const has = n => IMG[n] && IMG[n].ok && IMG[n].naturalWidth > 0;
const TINT = {};
function tinted(n, col){
  const k = n + col; if (TINT[k]) return TINT[k];
  const im = IMG[n];
  return TINT[k] = mk(im.naturalWidth, im.naturalHeight, (g,w,h)=>{ g.drawImage(im,0,0); g.globalCompositeOperation='source-atop'; g.fillStyle=col; g.fillRect(0,0,w,h); });
}

/* ---------------- sprites procedurales ---------------- */
const SPR = {};
function R(g,c,x,y,w,h){g.fillStyle=c;g.fillRect(x,y,w,h)}
SPR.w = {
  machete: mk(44,16,(g)=>{ R(g,'#3a2a1c',2,6,10,4); R(g,'#5b4129',3,7,8,2); R(g,'#ffb020',12,3,2,10);
    g.fillStyle='#cfd6e2'; g.beginPath(); g.moveTo(14,5); g.lineTo(38,5); g.lineTo(42,9); g.lineTo(38,11); g.lineTo(14,10); g.closePath(); g.fill();
    R(g,'#f5f8ff',15,6,22,2); R(g,'#8b95a8',15,9,22,1); }),
  pistol: mk(44,16,(g)=>{ R(g,'#15181e',5,4,20,6); R(g,'#3d4452',6,5,18,2); R(g,'#8892a4',8,5,14,1); R(g,'#15181e',6,9,6,7); R(g,'#2a2f3a',7,10,4,5); R(g,'#0b0d11',25,5,4,3); }),
  shotgun: mk(60,16,(g)=>{ R(g,'#4a2f1a',2,6,14,6); R(g,'#6b4527',3,7,12,2); R(g,'#15181e',16,5,40,3); R(g,'#2a2f3a',16,8,38,3); R(g,'#8892a4',17,5,36,1); R(g,'#ffb020',30,9,10,2); R(g,'#0b0d11',56,5,3,6); }),
  smg: mk(52,16,(g)=>{ R(g,'#15181e',4,4,34,7); R(g,'#3d4452',5,5,32,2); R(g,'#8892a4',8,5,24,1); R(g,'#15181e',6,10,5,6); R(g,'#2a2f3a',20,10,6,6); R(g,'#15181e',38,6,10,3); R(g,'#0b0d11',48,5,3,5); R(g,'#4a2f1a',0,5,5,5); })
};
SPR.ammo = mk(18,14,(g)=>{ R(g,'#000',0,3,18,11); R(g,'#c98a10',1,4,16,9); R(g,'#ffb020',1,4,16,3); R(g,'#3a2506',3,8,12,2); for(let i=0;i<4;i++){R(g,'#f3d27a',3+i*4,0,3,5);R(g,'#b8860b',3+i*4,0,3,1)} });
SPR.med = mk(18,16,(g)=>{ R(g,'#000',0,1,18,15); R(g,'#f4f6fa',1,2,16,13); R(g,'#d8dde8',1,12,16,3); R(g,'#e0303c',7,4,4,9); R(g,'#e0303c',4,7,10,3); });
SPR.scrap = mk(14,12,(g)=>{ R(g,'#000',0,2,14,10); R(g,'#8c95a8',1,3,12,8); R(g,'#c5ccda',2,3,6,3); R(g,'#ffb020',8,6,4,4); R(g,'#5a6275',1,9,12,2); });
SPR.car = ['#667a94','#8a3a3a','#3f6a56','#9a8a4a'].map(col=>mk(64,42,(g)=>{
  g.fillStyle='rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(32,38,30,5,0,0,TAU); g.fill();
  R(g,'#0b0d11',6,31,12,8); R(g,'#0b0d11',46,31,12,8);
  R(g,'#000',2,13,60,22); R(g,col,3,14,58,20); R(g,'rgba(255,255,255,.18)',3,14,58,4); R(g,'rgba(0,0,0,.28)',3,29,58,5);
  R(g,'#000',12,2,40,16); R(g,col,13,3,38,14); R(g,'rgba(255,255,255,.14)',13,3,38,3);
  R(g,'#1b2433',16,5,14,10); R(g,'#1b2433',34,5,14,10); R(g,'#3a4a66',17,6,5,3); R(g,'#3a4a66',35,6,5,3);
  R(g,'#ffd77a',58,18,4,4); R(g,'#e0303c',2,18,3,4); R(g,'#14171d',26,24,12,2);
  R(g,'rgba(120,70,30,.55)',8,24,6,4); R(g,'rgba(120,70,30,.55)',44,20,8,3); }));
SPR.barrier = mk(46,26,(g)=>{ g.fillStyle='rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(23,23,22,3,0,0,TAU); g.fill();
  R(g,'#000',2,8,42,16); R(g,'#9097a5',3,9,40,14); R(g,'#b9c0cd',3,9,40,3); R(g,'#6a7180',3,19,40,4);
  R(g,'#000',6,2,34,10); R(g,'#a4abb9',7,3,32,8); R(g,'#c9cfdb',7,3,32,2);
  for(let i=0;i<4;i++){R(g,'#e0303c',9+i*8,13,4,6)} });
SPR.drum = mk(18,24,(g)=>{ g.fillStyle='rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(9,21,8,3,0,0,TAU); g.fill();
  R(g,'#000',1,4,16,18); R(g,'#a8322a',2,5,14,16); R(g,'#d2554a',2,5,4,16); R(g,'#6e1f1a',12,5,4,16); R(g,'#4a1612',2,10,14,1); R(g,'#4a1612',2,16,14,1);
  R(g,'#000',1,2,16,5); R(g,'#c8c8d0',2,3,14,3); R(g,'#ffb020',7,11,4,4); });

/* ---------------- sonido ---------------- */
let AC = null, muted = false;
function ac(){ if (AC === null) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { AC = false; } } if (AC && AC.state === 'suspended') AC.resume(); return AC || null; }
function tone(f0, f1, dur, type, vol){
  const a = ac(); if (!a || muted) return; const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain(); o.type = type || 'square';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, fc){
  const a = ac(); if (!a || muted) return; const t = a.currentTime;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(); s.buffer = buf; const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc;
  const g = a.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
let lastHitSnd = 0;
function snd(k){
  if (muted) return;
  switch (k) {
    case 'pistol': noise(.1, .5, 3500); tone(220, 60, .09, 'square', .12); break;
    case 'shotgun': noise(.26, .8, 2200); tone(120, 40, .2, 'sawtooth', .18); break;
    case 'smg': noise(.06, .4, 4500); tone(260, 90, .05, 'square', .08); break;
    case 'swing': noise(.12, .25, 6000); break;

const WORLD = { w: 1280, h: 900 }, WALL = 30;
let ground = null, gctx = null, obstacles = [], bushes = [], crates = [];
let seed = 7;

function buildWorld(sd){
  seed = sd; const rng = mulberry(sd);
  ground = mk(WORLD.w, WORLD.h, (g, w, h) => {
    g.fillStyle = '#262930'; g.fillRect(0,0,w,h);
    for (let y = 0; y < h; y += 32) for (let x = 0; x < w; x += 32) { g.fillStyle = rng() < .5 ? '#2a2d35' : '#23262d'; g.fillRect(x, y, 32, 32); }
    for (let i = 0; i < 2600; i++) { g.fillStyle = rng() < .5 ? '#32353e' : '#1c1f25'; g.fillRect(rng()*w|0, rng()*h|0, 2, 2); }
    // calles
    const hy = 372, vx = 560;
    g.fillStyle = '#1d2027'; g.fillRect(0, hy, w, 150); g.fillRect(vx, 0, 150, h);
    g.fillStyle = '#383d48'; g.fillRect(0, hy-4, w, 4); g.fillRect(0, hy+150, w, 4); g.fillRect(vx-4, 0, 4, h); g.fillRect(vx+150, 0, 4, h);
    g.fillStyle = '#c9a227';
    for (let x = 10; x < w; x += 44) if (x < vx - 10 || x > vx + 160) g.fillRect(x, hy + 74, 26, 3);
    for (let y = 10; y < h; y += 44) if (y < hy - 10 || y > hy + 160) g.fillRect(vx + 74, y, 3, 26);
    g.fillStyle = 'rgba(230,230,235,.5)';
    for (let i = 0; i < 6; i++) { g.fillRect(vx + 6 + i*24, hy - 40, 12, 32); g.fillRect(vx + 6 + i*24, hy + 158, 12, 32); }
    // grietas y manchas
    g.strokeStyle = '#14161b'; g.lineWidth = 2;
    for (let i = 0; i < 30; i++) { let x = rng()*w, y = rng()*h; g.beginPath(); g.moveTo(x,y); for (let k = 0; k < 5; k++) { x += (rng()-.5)*30; y += (rng()-.5)*30; g.lineTo(x|0,y|0); } g.stroke(); }
    for (let i = 0; i < 16; i++) { g.fillStyle = 'rgba(10,10,14,.35)'; g.fillRect(rng()*w|0, rng()*h|0, 14 + rng()*26|0, 8 + rng()*14|0); }
    // muro perimetral
    g.fillStyle = '#0f1116'; g.fillRect(0,0,w,WALL+10); g.fillRect(0,h-WALL,w,WALL); g.fillRect(0,0,WALL,h); g.fillRect(w-WALL,0,WALL,h);
    g.fillStyle = '#1a1e27'; g.fillRect(0,WALL+6,w,4); g.fillRect(0,h-WALL,w,3); g.fillRect(WALL-3,0,3,h); g.fillRect(w-WALL,0,3,h);
    g.fillStyle = '#ffb020';
    for (let x = WALL; x < w - WALL; x += 24) { g.fillRect(x, WALL+2, 12, 3); g.fillRect(x, h-WALL-3, 12, 3); }
    for (let y = WALL; y < h - WALL; y += 24) { g.fillRect(WALL-2, y, 3, 12); g.fillRect(w-WALL-1, y, 3, 12); }
    g.fillStyle = '#151922'; for (let x = 0; x < w; x += 40) g.fillRect(x, 8, 2, WALL-6);
  });
  gctx = ground.getContext('2d');
  // obstaculos
  obstacles = [];
  const kinds = [['car',54,24],['car',54,24],['barrier',42,12],['barrier',42,12],['drum',14,10]];
  let tries = 0;
  while (obstacles.length < 22 && tries++ < 400) {
    const k = kinds[Math.floor(rng()*kinds.length)];
    const o = { kind:k[0], w:k[1], h:k[2], x: WALL+40 + rng()*(WORLD.w-2*WALL-120), y: WALL+60 + rng()*(WORLD.h-2*WALL-120) };
    if (Math.abs(o.x - WORLD.w/2) < 110 && Math.abs(o.y - WORLD.h/2) < 90) continue;
    if (obstacles.some(q => o.x < q.x+q.w+34 && o.x+o.w+34 > q.x && o.y < q.y+q.h+34 && o.y+o.h+34 > q.y)) continue;
    o.spr = k[0]==='car' ? SPR.car[Math.floor(rng()*SPR.car.length)] : SPR[k[0]];
    obstacles.push(o);
  }
  bushes = [];
  for (let i = 0; i < 14; i++) bushes.push({ x: WALL+30 + rng()*(WORLD.w-2*WALL-60), y: WALL+40 + rng()*(WORLD.h-2*WALL-70) });
  crates = [];
}
function freeSpot(minDist, px, py){
  for (let t = 0; t < 60; t++) {
    const x = WALL+50 + Math.random()*(WORLD.w-2*WALL-100), y = WALL+60 + Math.random()*(WORLD.h-2*WALL-110);
    if (obstacles.some(o => x > o.x-24 && x < o.x+o.w+24 && y > o.y-24 && y < o.y+o.h+24)) continue;
    if (px !== undefined && Math.hypot(x-px, y-py) < minDist) continue;
    return { x, y };
  }
  return { x: WORLD.w/2 + rnd(-100,100), y: WORLD.h/2 + rnd(-100,100) };
}
function pushOut(e, r){
  let hit = false;
  for (const o of obstacles) {
    const cx = clamp(e.x, o.x, o.x+o.w), cy = clamp(e.y, o.y, o.y+o.h), dx = e.x-cx, dy = e.y-cy, d2 = dx*dx+dy*dy;
    if (d2 < r*r) { if (d2 < .0001) e.y = o.y - r; else { const d = Math.sqrt(d2); e.x = cx + dx/d*r; e.y = cy + dy/d*r; } hit = true; }
  }
  e.x = clamp(e.x, WALL + r, WORLD.w - WALL - r);
  e.y = clamp(e.y, WALL + 12 + r, WORLD.h - WALL - r);
  return hit;
}

function composeWave(n){
  const list = [], total = 5 + n*2 + Math.floor(n*n/6), brutes = n >= 4 ? Math.floor((n-2)/2) : 0, rp = n >= 2 ? Math.min(.45, .12*(n-1)) : 0;
  for (let i = 0; i < brutes; i++) list.push('brute');
  while (list.length < total) list.push(Math.random() < rp ? 'runner' : 'walker');
  for (let i = list.length-1; i > 0; i--) { const j = (Math.random()*(i+1))|0; [list[i], list[j]] = [list[j], list[i]]; }
  return list;
}
function startWave(){
  wave++; phase = 'fight'; spawnQ = composeWave(wave); spawnT = .5;
  banner('OLEADA ' + wave, spawnQ.length + ' ZOMBIS EN CAMINO'); snd('wave'); updateStars(); $('prep').classList.add('hide');
}
function endWave(){
  phase = 'prep'; phaseT = 12;
  const bonus = 2 + wave; scrap += bonus;
  crates = crates.filter(c => !c.open);
  for (let i = 0; i < 3 && crates.length < 9; i++) crates.push(Object.assign(freeSpot(100, P.x, P.y), { open:false }));
  P.hp = Math.min(P.max, P.hp + 15);
  if (wave > best) { best = wave; localStorage.setItem('sectorS_best', best); }
  banner('OLEADA SUPERADA', '+' + bonus + ' CHATARRA · +15 SALUD'); toast('PASA POR EL TALLER (B)');
  autosave();
}
function spawnZombie(type){
  const t = ZT[type]; let x, y, tries = 0;
  do {
    const e = (Math.random()*4)|0;
    if (e === 0) { x = rnd(WALL+30, WORLD.w-WALL-30); y = WALL + 40; }
    else if (e === 1) { x = rnd(WALL+30, WORLD.w-WALL-30); y = WORLD.h - WALL - 24; }
    else if (e === 2) { x = WALL + 24; y = rnd(WALL+50, WORLD.h-WALL-30); }
    else { x = WORLD.w - WALL - 24; y = rnd(WALL+50, WORLD.h-WALL-30); }

}

function makeStick(zone, base, knob, defCenter){
  const st = { x:0, y:0, mag:0, active:false, id:null }; let cx = 0, cy = 0; const RAD = 52;
  const setBase = (x, y) => { base.style.left = (x-55) + 'px'; base.style.top = (y-55) + 'px'; };
  function upd(e){ let dx = e.clientX-cx, dy = e.clientY-cy; const d = Math.hypot(dx,dy); if (d > RAD) { dx = dx/d*RAD; dy = dy/d*RAD; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; st.x = dx/RAD; st.y = dy/RAD; st.mag = Math.hypot(st.x, st.y); }
  st.reset = function(){ st.x = 0; st.y = 0; st.mag = 0; st.active = false; st.id = null; knob.style.transform = 'translate(0px,0px)'; base.classList.remove('on'); const d = defCenter(); setBase(d[0], d[1]); };
  zone.addEventListener('pointerdown', e => { if (st.active || mode !== 'play') return; e.preventDefault(); try { zone.setPointerCapture(e.pointerId); } catch(_){}
    st.active = true; st.id = e.pointerId; cx = clamp(e.clientX, 60, innerWidth-60); cy = clamp(e.clientY, 60, innerHeight-60); setBase(cx, cy); base.classList.add('on'); upd(e); });
  zone.addEventListener('pointermove', e => { if (e.pointerId !== st.id) return; e.preventDefault(); upd(e); });
  const end = e => { if (e.pointerId === st.id) st.reset(); };
  zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
  st.reset(); return st;
}

/* ---------------- acciones del jugador ---------------- */
const curW = () => WEAPONS[P.w];
function selectWeapon(i){ if (i === P.w || !owned[i]) return; P.w = i; P.reload = 0; P.cd = .15; hudForce(); }
function swapNext(){ let i = P.w; for (let n = 0; n < 4; n++) { i = (i + 1) % 4; if (owned[i]) { selectWeapon(i); return; } } }
function reloadStart(){ const w = curW(); if (w.melee || P.reload > 0 || mags[P.w] >= w.mag || reserve[P.w] <= 0) return; P.reload = w.reload; snd('reload'); }
function useMed(){ if (meds < 1) return toast('SIN BOTIQUINES'); if (P.hp >= P.max) return toast('SALUD AL MÁXIMO'); meds--; P.hp = Math.min(P.max, P.hp + 45); snd('buy'); addFloat(P.x, P.y - 30, '+45', '#ff8fd0'); }
function nearestCrate(){ let b = null, bd = 48; for (const c of crates) { if (c.open) continue; const d = Math.hypot(c.x-P.x, c.y-P.y); if (d < bd) { bd = d; b = c; } } return b; }
function useAction(){
  const c = nearestCrate(); if (!c) return toast('ACÉRCATE A UNA CAJA');
  c.open = true; snd('pick'); const r = Math.random();
  const ranged = [1,2,3].filter(i => owned[i]);
  if (r < .08 && (!owned[2] || !owned[3])) { const i = !owned[2] ? 2 : 3; giveWeapon(i); toast('¡ARMA ENCONTRADA: ' + WEAPONS[i].name + '!'); }
  else if (r < .45 && ranged.length) { const i = ranged.includes(P.w) && Math.random() < .6 ? P.w : ranged[(Math.random()*ranged.length)|0]; reserve[i] += WEAPONS[i].pack; toast('+' + WEAPONS[i].pack + ' MUNICIÓN ' + WEAPONS[i].name); }
  else if (r < .7) { meds++; toast('+1 BOTIQUÍN'); }
  else { const a = 3 + ((Math.random()*4)|0); scrap += a; toast('+' + a + ' CHATARRA'); }
  hudForce();
}
function giveWeapon(i){ owned[i] = true; mags[i] = WEAPONS[i].mag; reserve[i] += WEAPONS[i].pack * 2; selectWeapon(i); }

const dmgMul = () => 1 + .15 * dmgLv;
function tryFire(){
  const w = curW(); if (P.cd > 0 || P.reload > 0) return;
  if (w.melee) return swing(w);
  if (mags[P.w] <= 0) { if (reserve[P.w] > 0) reloadStart(); else { toast('SIN MUNICIÓN'); P.cd = .35; snd('empty'); } return; }
  mags[P.w]--; P.cd = w.rate; P.kick = 5; P.flash = .06; shake = Math.max(shake, w.pellets > 1 ? 4 : 1.2);
  const a0 = P.aim, ox = P.x + Math.cos(a0) * (w.len + 6), oy = P.y + Math.sin(a0) * (w.len + 6) * .9;
  for (let i = 0; i < w.pellets; i++) {
    const a = a0 + (Math.random() - .5) * w.spread * 2, sp = w.speed * rnd(.92, 1.06);
    bullets.push({ x: ox, y: oy, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, dmg: w.dmg * dmgMul(), life: w.life, pierce: w.pierce, hit: [] });
  }
  for (let i = 0; i < 3; i++) parts.push({ x: ox, y: oy-6, vx: Math.cos(a0)*rnd(40,140)+rnd(-30,30), vy: Math.sin(a0)*rnd(40,140)+rnd(-30,30), life: rnd(.1,.22), t: 0, c: '#ffd86b', s: 2 });
  snd(w.snd);
  if (mags[P.w] <= 0 && reserve[P.w] > 0) setTimeout(() => { if (mode === 'play') reloadStart(); }, 120);
}
function swing(w){
  P.cd = w.rate; P.swing = .22; snd('swing'); shake = Math.max(shake, 1.5);
  effects.push({ x: P.x + Math.cos(P.aim)*30, y: P.y + Math.sin(P.aim)*28 - 6, a: P.aim, t: 0, max: .2 });
  for (const z of zombies) {
    const dx = z.x - P.x, dy = z.y - P.y, d = Math.hypot(dx, dy);
    if (d < w.range + z.r && angDiff(Math.atan2(dy, dx), P.aim) < w.arc/2) hurtZombie(z, w.dmg * dmgMul(), dx/(d||1), dy/(d||1), 260);
  }
}
function hurtZombie(z, dmg, nx, ny, kn){
  z.hp -= dmg; z.flash = .09; z.kx += nx * kn; z.ky += ny * kn; snd('hit');
  for (let i = 0; i < 4; i++) parts.push({ x: z.x, y: z.y - 8, vx: nx*rnd(30,120)+rnd(-60,60), vy: ny*rnd(30,120)+rnd(-60,60)-40, life: rnd(.25,.5), t: 0, c: Math.random() < .5 ? '#7d1018' : '#a31a24', s: 2, g: 260 });
  if (z.hp <= 0) killZombie(z);
}
function killZombie(z){
  const i = zombies.indexOf(z); if (i < 0) return; zombies.splice(i, 1); kills++; snd('kill');
  for (let k = 0; k < 10; k++) parts.push({ x: z.x, y: z.y - 8, vx: rnd(-110,110), vy: rnd(-130,30), life: rnd(.3,.7), t: 0, c: Math.random() < .5 ? '#7d1018' : '#4d0a10', s: 3, g: 300 });
  for (let k = 0; k < 18; k++) { gctx.fillStyle = Math.random() < .5 ? 'rgba(125,16,24,.8)' : 'rgba(77,10,16,.8)'; const s = 2 + ((Math.random()*3)|0); gctx.fillRect((z.x + rnd(-16,16))|0, (z.y + rnd(-4,14))|0, s, s); }
  if (has('zombie')) { gctx.save(); gctx.translate(z.x|0, (z.y + 6)|0); gctx.rotate(z.dir > 0 ? 1.45 : -1.45); gctx.globalAlpha = .5; gctx.drawImage(tinted('zombie','rgba(0,0,0,.55)'), -z.sz/2, -z.sz*.55, z.sz, z.sz); gctx.restore(); }
  const t = ZT[z.type];
  if (Math.random() < t.scrap) pickups.push({ k:'scrap', v: z.type === 'brute' ? 3 + ((Math.random()*3)|0) : 1, x: z.x + rnd(-8,8), y: z.y + rnd(-4,8), life: 22, ph: Math.random()*6 });
  if (Math.random() < .09) pickups.push({ k:'ammo', v: 0, x: z.x, y: z.y, life: 22, ph: 1 });
  if (Math.random() < .04) pickups.push({ k:'med', v: 1, x: z.x, y: z.y, life: 22, ph: 2 });
}
function hurtPlayer(d, nx, ny){
  if (P.inv > 0) return; P.hp -= d; P.inv = .45; shake = 7; redT = .35; snd('hurt');
  P.x += nx * 8; P.y += ny * 8;

/* ---------------- actualización ---------------- */
function update(dt){
  tNow += dt;
  // movimiento
  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft']) mx--; if (keys['d'] || keys['arrowright']) mx++;
  if (keys['w'] || keys['arrowup']) my--; if (keys['s'] || keys['arrowdown']) my++;
  if (stickL.active) { mx = stickL.x; my = stickL.y; }
  let ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; ml = 1; }
  const sp = 120 * (P.reload > 0 ? .88 : 1) * (P.w === 0 ? 1.1 : 1);
  P.moving = ml > .08;
  P.x += mx * sp * dt; P.y += my * sp * dt; pushOut(P, P.r);
  if (P.moving) P.bob += dt * 11;
  // apuntar y disparar
  let fire = false;
  if (stickR.active && stickR.mag > .2) { P.aim = Math.atan2(stickR.y, stickR.x); fire = stickR.mag > .4; }
  else if (mouse.active && !TOUCH) { const wx = mouse.x/ZOOM + cam.x, wy = mouse.y/ZOOM + cam.y; P.aim = Math.atan2(wy - P.y, wx - P.x); }
  else if (P.moving && !stickR.active) P.aim = Math.atan2(my, mx);

  P.cd -= dt; P.inv -= dt; P.swing = Math.max(0, P.swing - dt); P.kick = Math.max(0, P.kick - dt * 40); P.flash -= dt;
  if (P.reload > 0) { P.reload -= dt; if (P.reload <= 0) { const w = curW(), take = Math.min(w.mag - mags[P.w], reserve[P.w]); mags[P.w] += take; reserve[P.w] -= take; P.reload = 0; } }
  if (fire) tryFire();

  // oleadas
  if (phase === 'prep') {
    phaseT -= dt;
    const el = $('prep'); el.classList.remove('hide'); el.textContent = 'SIGUIENTE OLEADA EN ' + Math.max(0, Math.ceil(phaseT)) + 's';
    if (phaseT <= 0) startWave();
  } else {
    if (spawnQ.length && zombies.length < CAP) { spawnT -= dt; if (spawnT <= 0) { spawnZombie(spawnQ.pop()); spawnT = Math.max(.22, .9 - wave*.05); } }
    if (!spawnQ.length && zombies.length === 0) endWave();
  }

  // zombis
  for (let i = 0; i < zombies.length; i++) {
    const z = zombies[i]; z.flash -= dt; z.atk -= dt;
    const f = Math.exp(-8 * dt); z.x += z.kx * dt; z.y += z.ky * dt; z.kx *= f; z.ky *= f;

    }

  }

  // balas
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; let dead = false;
    const steps = 2;
    for (let s = 0; s < steps && !dead; s++) {
      b.x += b.vx * dt / steps; b.y += b.vy * dt / steps;
      if (b.x < WALL || b.x > WORLD.w - WALL || b.y < WALL + 12 || b.y > WORLD.h - WALL) { dead = true; break; }
      for (const o of obstacles) if (b.x > o.x && b.x < o.x+o.w && b.y > o.y && b.y < o.y+o.h) { dead = true; break; }

  if (parts.length > 320) parts.splice(0, parts.length - 320);
  for (let i = floats.length - 1; i >= 0; i--) { const f = floats[i]; f.a += dt; f.y -= 22*dt; if (f.a > f.life) floats.splice(i, 1); }
  for (let i = effects.length - 1; i >= 0; i--) { effects[i].t += dt; if (effects[i].t > effects[i].max) effects.splice(i, 1); }

}

  $('stats').innerHTML = 'OLEADA ALCANZADA: <b>' + wave + '</b><br>BAJAS: <b>' + kills + '</b><br>MEJOR OLEADA: <b>' + best + '</b>';
  show('gameover');
}
function toMenu(){ resetSticks(); mode = 'menu'; ui(false); $('best').textContent = best; show('menu'); }
$('new').onclick = () => { ac(); show('select'); };
$('back').onclick = () => show('menu');
$('enter').onclick = () => { ac(); startGame(null); };
$('retry').onclick = () => startGame(null);
document.querySelectorAll('.choice').forEach(b => b.onclick = () => { ch = b.dataset.char; document.querySelectorAll('.choice').forEach(q => q.classList.toggle('sel', q === b)); });
$('continue').onclick = () => { ac(); const s = localStorage.getItem('sectorS_b1'); if (!s) return msg('NO HAY PARTIDA GUARDADA.', 'CONTINUAR'); try { startGame(JSON.parse(s)); } catch(e) { msg('LA PARTIDA GUARDADA ESTÁ DAÑADA.', 'ERROR'); } };
$('resume').onclick = () => { mode = 'play'; show(null); };
$('save').onclick = () => msg(autosave() ? 'PROGRESO GUARDADO.' : 'NO SE PUDO GUARDAR.', 'GUARDAR');
$('quit').onclick = $('quit2').onclick = toMenu;
$('controls').onclick = () => msg('MÓVIL: STICK IZQUIERDO = MOVERTE. STICK DERECHO = APUNTAR Y DISPARAR. BOTONES: USAR CAJA, TALLER, CAMBIAR ARMA, R RECARGAR, + CURAR. PC: WASD, MOUSE, R, Q, 1-4, E, H, B. Elimina oleadas, junta chatarra y mejora tu equipo en el taller. Las flechas rojas del borde marcan zombis fuera de pantalla.', 'CÓMO JUGAR');
$('closeInfo').onclick = () => show(mode === 'pause' ? 'pauseScreen' : (mode === 'over' ? 'gameover' : 'menu'));

/* ---------------- bucle ---------------- */
let menuT = 0;
function loop(t){
  const dt = Math.min(.05, (t - last) / 1000 || .016); last = t;
  if (mode === 'play') update(dt);
  else if (mode === 'menu') { menuT += dt; cam.x = 200 + Math.sin(menuT*.15) * 150 + (WORLD.w - VW) * .25; cam.y = 150 + Math.cos(menuT*.12) * 90; tNow += dt; }
  render();
  requestAnimationFrame(loop);
}
buildWorld(7); P = newPlayer(); ch = 'male';
$('best').textContent = best;
requestAnimationFrame(loop);
</script>
